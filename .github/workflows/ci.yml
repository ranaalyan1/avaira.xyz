name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd contracts && npm ci
      - run: cd contracts && npm run build
      - run: cd contracts && npm test

  # The claims in FINDINGS.md / audit/ are executable, so CI runs them instead of trusting them:
  # solc-js build → attack scenarios → cross-language parity → deterministic demo trace → doctor.
  # Kept off `contracts` because it uses the solc-js build (`node tools/compile.mjs`), not forge, so
  # the EVM harness works on an image without Foundry.
  verification:
    name: Verification (redteam + parity + demo + doctor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          python -m pip install -r verification/requirements.txt --break-system-packages
          (cd sdk/typescript && npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
          (cd services/scorer && npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
      - name: Compile (solc-js, Foundry profile)
        run: node tools/compile.mjs
      - name: SDK + scorer suites
        run: |
          cd sdk/typescript && npm run typecheck && npm test
          cd ../../services/scorer && npm run typecheck && npm test
      - name: Attack scenarios (FINDINGS.md tripwire)
        run: python tools/avaira_evm/attacks.py --json verification/reports/redteam.json
      - name: Cross-language parity
        run: python tools/parity/compare.py --json verification/reports/parity.json
      - name: Deterministic demo trace (must match the committed golden file)
        run: python tools/demo.py --check
      - name: Docs and claims self-consistency
        # Deliberately not `--strict-warnings` yet: three open warnings are real product gaps
        # (SP-02 gateway missing, SP-06 scorer `main`/`smoke:kimi`) that this PR does not touch.
        # Tighten this line to --strict-warnings when those land; `make doctor` prints them either way.
        run: python tools/doctor.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: verification/reports/*.json
          if-no-files-found: warn

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov --break-system-packages
      - run: pytest tests/test_backend_units.py tests/test_v2_core.py tests/test_cognitive_os.py -q --tb=short
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: avaira_test
          PERMIT_SECRET: test-secret-32-chars-minimum-here

  cognitive-os:
    name: Cognitive OS v5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install test deps (full suite + demos need the pinned backend deps)
        run: pip install -r backend/requirements.txt pytest pytest-asyncio --break-system-packages
      - name: Cognitive OS test suite (21 offline tests)
        run: pytest tests/test_cognitive_os.py -q --tb=short
      - name: Deterministic proof artifacts (must run twice, byte-identical)
        run: |
          python -m avaira_os.demos > /tmp/demos_1.txt
          python -m avaira_os.demos > /tmp/demos_2.txt
          diff /tmp/demos_1.txt /tmp/demos_2.txt
          tail -7 /tmp/demos_1.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && yarn build
      - run: cd frontend && yarn test --passWithNoTests --watchAll=false
