name: AVAIRA CI/CD

on:
  push:
    branches:
      - main
  # Allows a production deploy to be triggered by hand from the Actions tab
  # without pushing a commit to main.
  workflow_dispatch:

# Never let two production deploys race each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: |
          python -m pytest ../tests/test_backend_units.py -q

      - name: Notify Vercel check - backend-tests
        if: ${{ always() }}
        continue-on-error: true
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          # NOTE: keep this value quoted. An unquoted colon turns the line into
          # invalid YAML and GitHub rejects the whole workflow file.
          name: "Vercel - avaira-v2: backend-tests"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # frontend/.npmrc pins legacy-peer-deps=true (React 19 vs
        # react-day-picker 8 peers), so a plain `npm ci` resolves.
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        # CI=true makes CRA treat lint warnings as errors; keep parity with the
        # Vercel build, which uses the same CI=false escape hatch.
        run: CI=false npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 14

      - name: Notify Vercel check - frontend-build
        if: ${{ always() }}
        continue-on-error: true
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - avaira-v2: frontend-build"

  deploy-frontend:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    if: ${{ always() && needs.backend-tests.result == 'success' && needs.frontend-build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Full Stack To Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          # Deploy the repository root so Vercel picks up the root vercel.json
          # (frontend build + SPA rewrites). The pre-flight build above is the
          # same command Vercel runs, so the deploy is a replay, not a surprise.
          working-directory: ./

      - name: Notify Vercel check - deploy-frontend
        if: ${{ always() }}
        continue-on-error: true
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - avaira-v2: deploy-frontend"
