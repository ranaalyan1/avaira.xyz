[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "./deployments" }]

fuzz = { runs = 512, max_test_rejects = 65536 }
invariant = { runs = 64, depth = 32, fail_on_revert = false }

gas_reports = [
    "AvairaIdentityRegistry",
    "AvairaReputationRegistry",
    "AvairaValidationRegistry",
    "AvairaStakeRegistry",
    "AvairaIntentVault",
    "AvairaCreditMarket",
]

[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 128, depth = 64 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

# Monad testnet — set MONAD_RPC_URL / MONAD_TESTNET_RPC to override.
[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"
local = "http://127.0.0.1:8545"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", chain = 10143, url = "${MONADSCAN_API_URL}" }
