<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#05060A" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <!-- SEO Meta -->
        <title>AVAIRA — Nothing spends until the gate returns a permit</title>
        <meta name="description" content="AVAIRA gates agent actions before they execute. The risk envelope, a versioned OPA Rego policy and an interval prover have to agree before a signed single-use permit exists, and that permit is the only thing that lets the action run. Rating, clearing and underwriting in one request path." />
        <meta name="keywords" content="AVAIRA, agent execution control, risk envelope, EIP-712 permits, OPA Rego policy, interval prover, ERC-8004 agent identity, Avaira Score, agent underwriting, EIP-3009 USDC, EVM" />
        <meta name="author" content="AVAIRA Protocol" />
        <meta name="robots" content="index, follow" />
        <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
        <link rel="canonical" href="https://avaira.xyz/" />
        <link rel="icon" href="/logo.png" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://avaira.xyz/" />
        <meta property="og:title" content="AVAIRA — Nothing spends until the gate returns a permit" />
        <meta property="og:description" content="Envelope, policy and prover must agree before an agent action runs. Nine refusal codes, one permit." />
        <meta property="og:image" content="https://avaira.xyz/logo.png" />
        <meta property="og:image:alt" content="The Avaira protocol mark: a lime-on-black geometric sigil" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:site_name" content="AVAIRA Protocol" />

        <!-- Twitter / X Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:url" content="https://avaira.xyz/" />
        <meta name="twitter:title" content="AVAIRA — Execution control for agents" />
        <meta name="twitter:description" content="Envelope, policy and prover must agree before an agent action runs. Nine refusal codes, one permit." />
        <meta name="twitter:image" content="https://avaira.xyz/logo.png" />
        <meta name="twitter:image:alt" content="The Avaira protocol mark: a lime-on-black geometric sigil" />

        <!-- Structured Data (JSON-LD) -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "AVAIRA Protocol",
            "description": "Pre-execution control for autonomous agents. Checks every intent against a risk envelope, a policy file and a symbolic prover, then issues a single-use permit for the ones that clear.",
            "url": "https://avaira.xyz",
            "applicationCategory": "Blockchain",
            "operatingSystem": "Web"
        }
        </script>

        <!-- The React app self-hosts its fonts (Space Grotesk, IBM Plex Mono);
             the boot loader below runs on the system stack only. -->


<!-- Boot loader: matches the live brand (black, one neon accent) so the
             first paint and the app share the same visual language. React
             replaces #root's content on mount; until then this is all the
             visitor sees. Google reads the rendered app for SEO; the meta
             tags and JSON-LD above cover crawlers that do not run JS. -->
        <style>
            .boot{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;
                align-items:center;justify-content:center;gap:28px;margin:0}
            .boot img{width:96px;height:96px;border-radius:20px;animation:bootPulse 1.8s ease-in-out infinite}
            .boot h1{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-size:1.6rem;
                font-weight:700;letter-spacing:-0.02em;color:#f4f4ef;margin:0}
            .boot h1 span{color:#ccff00}
            .boot .bar{width:160px;height:2px;background:rgba(255,255,255,0.12);overflow:hidden;border-radius:2px}
            .boot .bar::after{content:"";display:block;width:40%;height:100%;background:#ccff00;
                animation:bootSlide 1.1s ease-in-out infinite}
            @keyframes bootPulse{0%,100%{opacity:1}50%{opacity:0.55}}
            @keyframes bootSlide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
            @media (prefers-reduced-motion: reduce){.boot img,.boot .bar::after{animation:none}}
        </style>
    </head>
    <body>
        <div id="root">
            <div class="boot" aria-label="Avaira is loading">
                <img src="/logo.png" alt="Avaira" width="96" height="96" />
                <h1>AVaira<span>.</span></h1>
                <div class="bar" aria-hidden="true"></div>
            </div>
        </div>

        <noscript>
            <p style="text-align:center;padding:40px;font-family:system-ui,sans-serif;color:#a2a29a;background:#000">
                AVAIRA Protocol requires JavaScript. The protocol gates agent actions before
                they execute — envelope, policy and prover must agree before a permit is issued.
            </p>
        </noscript>
    </body>
</html>
